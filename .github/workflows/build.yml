name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build
        run: dotnet publish Cyclop/Cyclop.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -warnaserror

      - uses: actions/upload-artifact@v4
        with:
          name: Cyclop-windows
          path: Cyclop/bin/Release/net9.0-windows10.0.19041.0/win-x64/publish/Cyclop.exe
